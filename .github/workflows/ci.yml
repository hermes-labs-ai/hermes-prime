name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    env:
      # Pin the fragment explicitly. --check needs only the fragment file; companion
      # tools (hermes-ground, hermes-rubric-blinded, handbook) are informational.
      HERMES_SESSION_INIT_FRAGMENT: ${{ github.workspace }}/CLAUDE-fragment.md

    steps:
      - uses: actions/checkout@v4

      - name: Show bash version
        run: bash --version

      - name: Install shellcheck
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            sudo apt-get update && sudo apt-get install -y shellcheck
          else
            brew install shellcheck
          fi

      - name: Lint bash binary
        run: shellcheck bin/hermes-session-init test-bootstrap.sh evals/preliminary-bootstrap-eval.sh scripts/check-public-truth.sh

      - name: Run mechanism tests (11 assertions)
        run: bash test-bootstrap.sh

      - name: Set up Python for MCP tests
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run MCP server tests (13 tests)
        run: |
          python -m pip install pytest
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 PYTHONDONTWRITEBYTECODE=1 \
            python -m pytest -p no:cacheprovider mcp-server/test_hermes_prime_mcp.py -q

      - name: Check current public-truth surfaces
        run: bash scripts/check-public-truth.sh

      - name: Run idempotency + roundtrip evals (E2 + E3, no claude-cli needed)
        run: bash evals/preliminary-bootstrap-eval.sh --skip-e1

      - name: Build MCP server package (sdist + wheel)
        run: |
          python -m pip install build
          python -m build

      - name: Validate server.json is well-formed JSON
        run: python -m json.tool server.json > /dev/null

      - name: Install built wheel in a clean venv and verify console script
        run: |
          python -m venv /tmp/hp-ci-venv
          /tmp/hp-ci-venv/bin/pip install dist/*.whl
          printf '%s\n%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18"}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"get_conventions","arguments":{}}}' \
            | /tmp/hp-ci-venv/bin/hermes-prime-mcp | tee /tmp/hp-ci-handshake.log
          grep -q '"serverInfo"' /tmp/hp-ci-handshake.log
          grep -q '"get_conventions"' /tmp/hp-ci-handshake.log
          grep -q 'session-init: BEGIN' /tmp/hp-ci-handshake.log
